# EPB-Wartungsmodus (elektrische Parkbremse) — Katalogentwurf (§10.2).
#
# R2: schreibt mit Rückwirkung. Zwei Sperren greifen, bevor ein Rahmen geht:
# 1. `freigabe: unbelegt` — die Definition ist nicht am Fahrzeug belegt,
#    deshalb lehnt `pruefe_freigabe()` sie ab, egal wer sie startet.
# 2. R2 verlangt zusätzlich die Bestätigung des Bedieners.
id: epb-wartungsmodus
titel: EPB in Wartungsstellung fahren
risk: R2
match:
  steuergeraete:
    - 0x7E0
preconditions:
  - klemme15
  - motor_aus
  - bordspannung:
      min_mv: 11500
      max_mv: 14500
backup:
  dids:
    - 0xF190
steps:
  - anfrage: "10 03"
    erwartet: "50 03"
    timeout_ms: 2000
    recovery:
      - anfrage: "10 01"
        erwartet: "50 01"
        timeout_ms: 1000
  - anfrage: "31 01 02 04"
    erwartet: "71 01 02 04"
    timeout_ms: 8000
provenance:
  quelle: "Katalogentwurf nach Plan §10.2 — Requests nicht am Fahrzeug belegt"
  freigabe: unbelegt
  evidence_hash: ""
