    erwartet: "50 03"
    timeout_ms: 2000
    recovery:
      - anfrage: "10 01"
        erwartet: "50 01"
        timeout_ms: 1000
  - anfrage: "31 01 02 06"
    erwartet: "71 01 02 06"
    timeout_ms: 10000
provenance:
  quelle: "Katalogentwurf nach Plan §10.2 — Requests nicht am Fahrzeug belegt"
  freigabe: unbelegt
