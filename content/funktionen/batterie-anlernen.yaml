# Batterie anlernen (Registrierung) — Katalogentwurf (§10.2).
#
# R2: nach dem Anlernen rechnet das Energiemanagement mit anderen Werten. Ein
# falsch eingetragener Typ (AGM statt EFB) verkürzt die Lebensdauer der neuen
# Batterie — deshalb Bestätigung und Backupspec der Kennungen.
id: batterie-anlernen
titel: Batterie anlernen
risk: R2
match:
  steuergeraete:
    - 0x7E0
preconditions:
  - klemme15
  - motor_aus
  - bordspannung:
      min_mv: 12500
      max_mv: 14500
backup:
  dids:
    - 0xF190
    - 0xF187
steps:
  - anfrage: "10 03"
    erwartet: "50 03"
    timeout_ms: 2000
    recovery:
      - anfrage: "10 01"
        erwartet: "50 01"
        timeout_ms: 1000
  - anfrage: "31 01 02 05"
    erwartet: "71 01 02 05"
    timeout_ms: 5000
provenance:
  quelle: "Katalogentwurf nach Plan §10.2 — Requests nicht am Fahrzeug belegt"
  freigabe: unbelegt
  evidence_hash: ""
