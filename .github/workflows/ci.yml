name: CI

on:
  push:
  pull_request:
  # Von Hand anstoßbar: ein Lauf lässt sich wiederholen, ohne dafür einen
  # leeren Commit zu brauchen.
  workflow_dispatch:

jobs:
  c:
    name: C-Kern und Konformitätskorpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests (165 Prüfungen)
        run: make -C j2534 test

      - name: Korpus ist aktuell
        run: |
          # Ohne `ls-files` wäre der Diff bei einer nicht eingecheckten Datei
          # stillschweigend grün: git diff meldet Unversioniertes nicht.
          git ls-files --error-unmatch core/tests/corpus/isotp.txt
          make -C j2534 corpus
          git diff --exit-code -- core/tests/corpus/isotp.txt

  rust:
    # Die Zahlen im Namen sind die lokal belegten: 224 Tests im Kern, 4 aus dem
    # Konformitätskorpus, 22 in der FFI-Schicht. Sie stehen hier, damit ein
    # Blick auf den Lauf genügt, um zu sehen, ob noch alle da sind.
    name: Rust-Kern (224 Kern, 4 Korpus, 22 FFI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Kern (ISO-TP gegen den Korpus)
        run: cargo test --locked --manifest-path core/Cargo.toml

      - name: FFI-Schicht
        run: cargo test --locked --manifest-path core-ffi/Cargo.toml

  clippy:
    name: Clippy (-D warnings, Kern und FFI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # `--all-targets` schließt die Tests ein: genau dort lagen die beiden
      # Warnungen, die ein Lauf ohne dieses Flag nie gefunden hätte
      # (`Scenario` per `Default::default()` gebaut, `len()` ohne `is_empty()`).
      - name: Kern
        run: cargo clippy --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings

      - name: FFI-Schicht
        run: cargo clippy --locked --manifest-path core-ffi/Cargo.toml --all-targets -- -D warnings

  fmt:
    # Eigener Job und nicht ein Schritt in `rust`: ein Formatfehler sagt nichts
    # über das Verhalten, und der Lauf soll zeigen, ob nur die Form abweicht —
    # ohne dafür die Tests erneut zu fahren.
    name: rustfmt (--check, Kern, FFI, Fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Drei Aufrufe statt einem: die Crates hängen nicht an einer gemeinsamen
      # Workspace-Wurzel, und `cargo fmt` arbeitet je Paket.
      - name: Kern
        run: cargo fmt --manifest-path core/Cargo.toml --check

      - name: FFI-Schicht
        run: cargo fmt --manifest-path core-ffi/Cargo.toml --check

      - name: Fuzz-Ziele
        run: cargo fmt --manifest-path core/fuzz/Cargo.toml --check

  deny:
    # Eigener Job wie `fmt`: eine unerwartete Lizenz oder eine bekannte Lücke im
    # Abhängigkeitsbaum sagt nichts über das Verhalten des Kerns, und der Lauf
    # soll zeigen, ob nur das Abhängigkeitsbild abweicht — ohne dafür die Tests
    # erneut zu fahren.
    name: cargo deny (Lizenzen, CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ein Schritt je Manifest, nicht ein Lauf über alle: `core`, `core-ffi`
      # und `core/fuzz` hängen nicht an einer gemeinsamen Workspace-Wurzel, jedes
      # hat sein eigenes `Cargo.lock`, und cargo-deny prüft den Graph, der zu
      # seinem Manifest gehört. So steht im Log, welcher Teil betroffen ist. Die
      # Regeln stehen in `deny.toml` im Wurzelverzeichnis; die Aktion bringt
      # cargo-deny selbst mit, hier wird also nichts nachinstalliert.
      - name: Kern
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
          # Vorgabe der Aktion ist `--all-features`; mit `--locked` gilt genau
          # die eingecheckte `Cargo.lock`, also der Stand, der ausgeliefert wird.
          arguments: --locked
          command: check licenses advisories

      - name: FFI-Schicht
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core-ffi/Cargo.toml
          arguments: --locked
          command: check licenses advisories

      # Die Fuzz-Ziele sind ein eigenes Paket mit eigenem Lockfile und eigener
      # Abhängigkeit (`libfuzzer-sys`); ohne diesen Schritt bliebe genau die
      # Kette ungeprüft, die fremde Bytes am längsten bearbeitet.
      - name: Fuzz-Ziele
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/fuzz/Cargo.toml
          arguments: --locked
          command: check licenses advisories

  deps:
    # Eigener Job wie `deny`: eine fremde Lizenz, ein neues Fremdmodul oder eine
    # Kopfddatei von außerhalb sagt nichts über das Verhalten des Kerns — und
    # der Befund soll im Log stehen, ohne die Tests dafür erneut zu fahren.
    #
    # Geprüft wird der *aufgelöste* Graph, nicht die Erklärung in den
    # Build-Dateien: nur so fallen transitive Module auf. Die Erlaubnislisten
    # stehen in `android/abhaengigkeiten.txt` und `j2534/abhaengigkeiten.txt`,
    # die Einzelheiten in `scripts/abhaengigkeiten-pruefen.sh`.
    name: Abhängigkeiten jenseits von Cargo (Kotlin/Java, C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Dieselbe Vorsichtsmaßnahme wie im Android-Job: keine Lizenzrückfrage
      # der Aktion, sondern ein eigener Schritt.
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ""

      # `com.android.application` braucht die Plattform schon beim
      # Konfigurieren (`compileSdk 37`). Das Image bringt sie nicht mit, und die
      # Plattform heißt seit API 36 mit Unterfassung `android-37.0`.
      - name: Plattform installieren
        run: |
          yes | sdkmanager --licenses > /dev/null
          yes | sdkmanager "platforms;android-37.0" > /dev/null

      - name: Abhängigkeiten prüfen
        run: sh scripts/abhaengigkeiten-pruefen.sh

  bindings:
    name: Kotlin- und Swift-Bindings
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Erzeugt, nicht gepflegt: die Bindings entstehen bei jedem Lauf neu aus
      # der Rust-Schnittstelle. Damit kann keine Kopie veralten (ADR-001 §5).
      - name: Bindings erzeugen
        # Die Skripte liegen ohne Ausführungsbit im Repository; `bash` macht den
        # Aufruf davon unabhängig.
        run: bash scripts/gen-bindings.sh kotlin swift

      - name: Hochladen
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-bindings
          path: core-ffi/bindings

  jvm-tests:
    name: JVM-Tests ohne Gerät (186)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable

      # Geladen wird der **Host-Build** derselben Rust-Quelle: die .so aus
      # jniLibs ist gegen Bionic gelinkt (libdl, Symbole der Version LIBC) und
      # auf glibc nicht ladbar — das ist kein Fehler der Tests, sondern der
      # Unterschied zwischen Android-ABI und dieser Maschine.
      - name: Host-Bibliothek
        run: cargo build --release --locked --manifest-path core-ffi/Cargo.toml

      - name: Kotlin-Bindings erzeugen
        run: bash scripts/gen-bindings.sh kotlin

      # Ohne Gradle, ohne Android SDK, ohne NDK: das Skript holt Compiler und
      # Jars selbst (Cache, sonst Maven Central) und übersetzt die Bindings mit
      # Ziel 17. Es bricht ab, wenn die Bibliothek fehlt oder für Android gebaut
      # ist — ein übersprungener Test darf nicht als grün durchgehen.
      - name: Alle Tests der App
        run: sh scripts/jvm-tests.sh

  android:
    name: Android — NDK-Bibliothek und Kotlin-Linktest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Nur das cmdline-tools-Paket, keine Lizenzen: die Aktion ruft
      # `sdkmanager --licenses` mit einer Rückfrage auf („Review licenses that
      # have not been accepted (y/N)?“), was den Job abgebrochen hat. Annehmen
      # und Nachinstallieren übernimmt der Schritt darunter.
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          # Nichts nachinstallieren: platform-tools und Plattformen bringt das
          # Image mit; gebraucht wird sdkmanager für Lizenzen und NDK.
          packages: ""

      - name: Lizenzen annehmen, NDK und SDK-Pakete installieren
        # `yes |` beantwortet die Lizenzfrage; ohne das kann der Schritt auf
        # einem frischen Runner hängen statt zu scheitern.
        #
        # Plattform und Build-Tools kommen mit: AGP 9.3.1 verlangt
        # `compileSdk 37` (Verzeichnis `android-37.0`) und Build-Tools 36.0.0.
        # Was das Image mitbringt, ist nicht garantiert — und ein fehlendes
        # Paket sähe im Log nach einem Fehler des Projekts aus.
        run: |
          yes | sdkmanager --licenses > /dev/null
          yes | sdkmanager "ndk;26.1.10909125" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      # Baut die Host-Bibliothek und erzeugt die Kotlin-Bindings.
      - name: Bindings und Host-Bibliothek
        run: bash scripts/gen-bindings.sh kotlin

      - name: Bibliothek für Android-ABIs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          # cargo-ndk liest Cargo.toml im Arbeitsverzeichnis; --manifest-path
          # funktioniert hier nicht. --platform 29 entspricht minSdk der App.
          cd core-ffi
          # --locked: die eingecheckte Cargo.lock gilt, sonst zieht die CI
          # stillschweigend neuere Abhängigkeiten als der Entwicklungsrechner.
          cargo ndk --platform 29 -t arm64-v8a -t x86_64 -o ../dist/androidJniLibs \
            build --release --locked

      - name: Architektur prüfen
        run: |
          readelf -h dist/androidJniLibs/arm64-v8a/libvci_ffi.so | grep -q AArch64
          readelf -h dist/androidJniLibs/x86_64/libvci_ffi.so | grep -q X86-64
          echo "arm64-v8a und x86_64 gebaut"

      # Ohne `gradle-version`: die Aktion nimmt dann den Wrapper des Projekts an
      # und richtet nur den Cache ein. Die Version steht allein in
      # android/gradle/wrapper/gradle-wrapper.properties — kein zweiter Pin,
      # und keine zweite Gradle-Distribution, die niemand benutzt.
      - uses: gradle/actions/setup-gradle@v3

      # Der eigentliche Beweis: Kotlin kompiliert die Bindings und ruft in die
      # Rust-Bibliothek. Ohne diesen Test wäre „die Bindings entstehen" nur
      # eine Behauptung.
      - name: Kotlin bindet gegen den Kern
        run: ./android/gradlew -p android :bindings:test --console=plain

      # Die App bekommt die gebauten .so-Dateien nach jniLibs; erst damit findet
      # sie den Kern zur Laufzeit. Der Build beweist Paketierung, Manifest und
      # Compose-Übersetzung — nicht, dass die App auf einem Gerät startet.
      #
      # Die feste Dongle-Bibliothek (3.12.0, Begründung in
      # android/app/build.gradle.kts) fällt genau hier auf, wenn jemand sie
      # hebt, ohne AGP und `compileSdk` mitzuheben: `checkDebugAarMetadata`
      # bricht dann mit „requires compile against version … or later“ ab.
      - name: App-APK bauen
        run: |
          mkdir -p android/app/src/main/jniLibs
          cp -r dist/androidJniLibs/* android/app/src/main/jniLibs/
          ./android/gradlew -p android :app:testDebugUnitTest :app:assembleDebug --console=plain
          # Beide ABIs müssen drin sein: sonst läuft die App auf dem einen
          # Tablet und auf dem anderen nicht (arm64-Gerät, x86-Emulator).
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libvci_ffi.so'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/x86_64/libvci_ffi.so'

      - name: JNI-Bibliotheken hochladen
        uses: actions/upload-artifact@v4
        with:
          name: android-jnilibs
          path: dist/androidJniLibs

  # Nicht aktiv: iOS. Braucht einen macOS-Runner (Xcode), ist hier nicht baubar.
  # Sobald app-ios/ existiert: cargo build --target aarch64-apple-ios(-sim),
  # xcodebuild -create-xcframework, dann xcodebuild -scheme WerkstattApp.
